name: Build and deploy Flutter Web App to Azure Web App

on:
  push:
    branches:
      - flutterflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x.x' # Asegúrate de que esta sea la versión de Flutter de tu proyecto

      - name: Get dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-app
          path: build/web # **Apunta al directorio de salida de la compilación de Flutter**

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-app # **Usa el nombre del artefacto que subiste en el paso anterior**

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_44965F1672294D609C9A93F390C2F4FA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D857756EFC8846F78C450AFA93C23BB1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6414FC64AF43499DB1A9AEB3FF956DA5 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pexel-flutterflow-app'
          slot-name: 'Production'
          package: . # **El punto (`.`) es correcto aquí, ya que el artefacto descargado es el contenido del directorio `build/web`**
